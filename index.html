<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>辺境の杖職人が、自分の作る魔法杖は世界最高だと気付くまで | 目次</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #171717;
        --muted: #626262;
        --paper: #f7f7f4;
        --panel: #ffffff;
        --line: #ddddda;
        --accent: #b2263a;
        --accent-ink: #ffffff;
        --reader-bg: #111111;
        --shadow: 0 16px 44px rgba(23, 23, 23, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family:
          "Hiragino Mincho ProN",
          "Yu Mincho",
          "YuMincho",
          "Noto Serif JP",
          Georgia,
          serif;
        line-height: 1.7;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      img {
        display: block;
        max-width: 100%;
      }

      .page-header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .header-inner {
        width: min(1080px, calc(100% - 32px));
        min-height: 260px;
        margin: 0 auto;
        padding: 42px 0 34px;
        display: grid;
        align-content: end;
        gap: 22px;
      }

      .series-mark {
        margin: 0;
        color: var(--accent);
        font-family:
          "Hiragino Sans",
          "Yu Gothic",
          "Meiryo",
          sans-serif;
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        max-width: 860px;
        font-size: clamp(2rem, 6vw, 4.9rem);
        font-weight: 700;
        line-height: 1.18;
      }

      .header-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .button {
        min-height: 44px;
        padding: 10px 18px;
        border: 1px solid var(--ink);
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family:
          "Hiragino Sans",
          "Yu Gothic",
          "Meiryo",
          sans-serif;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .button.primary {
        border-color: var(--accent);
        color: var(--accent-ink);
        background: var(--accent);
      }

      main {
        display: grid;
        gap: 56px;
      }

      .contents {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding-top: 46px;
      }

      .section-title {
        margin-bottom: 18px;
        font-size: clamp(1.55rem, 4vw, 2.5rem);
        line-height: 1.25;
      }

      .episode-list {
        margin: 0;
        padding: 0;
        display: grid;
        gap: 16px;
        list-style: none;
      }

      .episode-link {
        min-height: 168px;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        display: grid;
        grid-template-columns: minmax(112px, 180px) 1fr;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .episode-thumb {
        width: 100%;
        height: 100%;
        aspect-ratio: 3 / 4;
        object-fit: cover;
        object-position: top;
        background: #222222;
      }

      .episode-body {
        padding: 24px;
        display: grid;
        align-content: center;
        gap: 10px;
      }

      .episode-number {
        color: var(--accent);
        font-family:
          "Hiragino Sans",
          "Yu Gothic",
          "Meiryo",
          sans-serif;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .episode-title {
        font-size: clamp(1.35rem, 3.8vw, 2.2rem);
        line-height: 1.25;
      }

      .episode-meta {
        color: var(--muted);
        font-family:
          "Hiragino Sans",
          "Yu Gothic",
          "Meiryo",
          sans-serif;
        font-size: 0.9rem;
      }

      .reader {
        background: var(--reader-bg);
        color: #ffffff;
      }

      .reader-head {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 34px 0 24px;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
      }

      .reader-title {
        font-size: clamp(1.35rem, 4vw, 2.5rem);
        line-height: 1.28;
      }

      .reader-meta {
        color: #bdbdbd;
        font-family:
          "Hiragino Sans",
          "Yu Gothic",
          "Meiryo",
          sans-serif;
        font-size: 0.86rem;
        white-space: nowrap;
      }

      .manga-pages {
        width: min(724px, 100%);
        margin: 0 auto;
        padding-bottom: 44px;
      }

      .manga-page {
        width: 100%;
        height: auto;
        background: #ffffff;
      }

      .reader-nav {
        position: sticky;
        bottom: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(17, 17, 17, 0.92);
        backdrop-filter: blur(12px);
      }

      .reader-nav-inner {
        width: min(724px, calc(100% - 24px));
        min-height: 54px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-family:
          "Hiragino Sans",
          "Yu Gothic",
          "Meiryo",
          sans-serif;
        font-size: 0.86rem;
      }

      .reader-nav a {
        min-width: 88px;
        min-height: 38px;
        padding: 8px 12px;
        border: 1px solid rgba(255, 255, 255, 0.32);
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .reader-nav span {
        color: #cfcfcf;
      }

      @media (max-width: 640px) {
        .header-inner {
          min-height: 220px;
          padding-top: 34px;
        }

        .episode-link {
          grid-template-columns: 104px 1fr;
          min-height: 136px;
        }

        .episode-body {
          padding: 16px;
        }

        .reader-head {
          display: grid;
          align-items: start;
        }

        .reader-meta {
          white-space: normal;
        }
      }

      @media (max-width: 420px) {
        .header-actions,
        .button {
          width: 100%;
        }

        .episode-link {
          grid-template-columns: 88px 1fr;
        }

        .episode-body {
          padding: 14px;
          gap: 6px;
        }

        .episode-meta {
          font-size: 0.82rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="page-header" id="top">
      <div class="header-inner">
        <div>
          <p class="series-mark">WEB COMIC</p>
          <h1>辺境の杖職人が、自分の作る魔法杖は世界最高だと気付くまで</h1>
        </div>
        <nav class="header-actions" aria-label="ページ内ナビゲーション">
          <a class="button primary" href="#episode-01">第1話を読む</a>
          <a class="button" href="#contents">目次</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="contents" id="contents" aria-labelledby="contents-title">
        <h2 class="section-title" id="contents-title">目次</h2>
        <ol class="episode-list">
          <li>
            <a class="episode-link" href="#episode-01">
              <img
                class="episode-thumb"
                src="./01．ソフィア、婚約破棄される/01.png"
                alt="第1話 ソフィア、婚約破棄されるの表紙サムネイル"
                width="724"
                height="2172"
              >
              <span class="episode-body">
                <span class="episode-number">第1話</span>
                <span class="episode-title">ソフィア、婚約破棄される</span>
                <span class="episode-meta">縦読み漫画 / 全6枚</span>
              </span>
            </a>
          </li>
        </ol>
      </section>

      <section class="reader" id="episode-01" aria-labelledby="episode-01-title">
        <div class="reader-head">
          <div>
            <p class="episode-number">第1話</p>
            <h2 class="reader-title" id="episode-01-title">ソフィア、婚約破棄される</h2>
          </div>
          <p class="reader-meta">01．ソフィア、婚約破棄される / 全6枚</p>
        </div>

        <div class="manga-pages">
          <img class="manga-page" src="./01．ソフィア、婚約破棄される/01.png" alt="ソフィア、婚約破棄される 1ページ目" width="724" height="2172" loading="eager" decoding="async">
          <img class="manga-page" src="./01．ソフィア、婚約破棄される/02.png" alt="ソフィア、婚約破棄される 2ページ目" width="724" height="2172" loading="lazy" decoding="async">
          <img class="manga-page" src="./01．ソフィア、婚約破棄される/03.png" alt="ソフィア、婚約破棄される 3ページ目" width="724" height="2172" loading="lazy" decoding="async">
          <img class="manga-page" src="./01．ソフィア、婚約破棄される/04.png" alt="ソフィア、婚約破棄される 4ページ目" width="724" height="2172" loading="lazy" decoding="async">
          <img class="manga-page" src="./01．ソフィア、婚約破棄される/05.png" alt="ソフィア、婚約破棄される 5ページ目" width="724" height="2172" loading="lazy" decoding="async">
          <img class="manga-page" src="./01．ソフィア、婚約破棄される/06.png" alt="ソフィア、婚約破棄される 6ページ目" width="724" height="2172" loading="lazy" decoding="async">
        </div>

        <nav class="reader-nav" aria-label="読書ナビゲーション">
          <div class="reader-nav-inner">
            <a href="#contents">目次</a>
            <span>第1話 / 全6枚</span>
            <a href="#top">上へ</a>
          </div>
        </nav>
      </section>
    </main>
  </body>
</html>
